<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aqua Slider - 水流ジェット迷路</title>
<style>
:root{color-scheme:dark;--bg:#050b14;--glow:#00d2ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--bg);color:#fff}
body{font-family:'Helvetica Neue',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1{margin:8px 0 4px;font-size:2rem;font-weight:300;letter-spacing:4px;text-transform:uppercase;background:linear-gradient(90deg,var(--glow),#fff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.description{font-size:.9rem;color:#8a9eb5;margin-bottom:12px;text-align:center;padding:0 12px}
button{background:transparent;border:1px solid var(--glow);color:var(--glow);padding:8px 20px;font-size:1rem;cursor:pointer;border-radius:4px;transition:all .3s}
button:hover{background:var(--glow);color:var(--bg);box-shadow:0 0 15px var(--glow)}
.controls{display:flex;gap:10px;margin-bottom:14px}
#game-container{position:relative;box-shadow:0 0 30px rgba(0,0,0,.8),0 0 50px rgba(0,136,255,.2);border-radius:8px;overflow:hidden;background:#08101c;max-width:100%}
canvas{display:block;max-width:100%;height:auto}
#clear-message{display:none;position:absolute;inset:0;background:rgba(5,11,20,.85);backdrop-filter:blur(4px);flex-direction:column;align-items:center;justify-content:center;z-index:10}
#clear-message h2{font-size:3rem;color:var(--glow);margin:0 0 20px;letter-spacing:2px;text-shadow:0 0 20px var(--glow)}
.pad{display:flex;gap:16px;margin-top:14px}
.sliders{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:20;width:220px;box-sizing:border-box;padding:18px 18px 20px;display:grid;gap:18px;font-size:.85rem;color:#8a9eb5;background:linear-gradient(160deg,rgba(20,38,64,.72),rgba(8,16,30,.72));border:1px solid rgba(0,210,255,.25);border-radius:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.55),0 0 30px rgba(0,136,255,.15),inset 0 1px 0 rgba(255,255,255,.08)}
.sliders h3{margin:0;font-size:.75rem;font-weight:600;letter-spacing:3px;color:var(--glow);text-transform:uppercase}
.sliders label{display:grid;grid-template-columns:1fr auto;align-items:center;row-gap:10px}
.sliders output{grid-column:2;grid-row:1;color:#fff;font-variant-numeric:tabular-nums;background:rgba(0,210,255,.12);border:1px solid rgba(0,210,255,.3);border-radius:6px;padding:1px 8px;font-size:.8rem}
.sliders input{grid-column:1/-1;grid-row:2;-webkit-appearance:none;appearance:none;width:100%;height:4px;margin:0;border-radius:2px;background:linear-gradient(90deg,#0088ff,#00d2ff);outline:none;opacity:.85}
.sliders input:hover{opacity:1}
.sliders input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--glow);box-shadow:0 0 10px var(--glow);cursor:pointer}
.sliders input::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--glow);box-shadow:0 0 10px var(--glow);cursor:pointer}
.sliders h3{display:flex;justify-space:between;align-items:center;cursor:grab;touch-action:none}.sliders h3 button{padding:0 8px;font-size:.85rem;line-height:1.5;border-color:rgba(0,210,255,.4)}.sliders.hidden{display:none}.fab{display:none;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:20;width:48px;height:48px;padding:0;font-size:1.4rem;border-radius:50%;background:rgba(8,16,30,.85);box-shadow:0 4px 20px rgba(0,0,0,.5),0 0 15px rgba(0,136,255,.25)}
.pad button{width:96px;height:56px;font-size:1.6rem;padding:0}
/* 落下中の自機は、操作ボタン類(z-index:16)や設定パネル(20)より背面を通る */
.controls,.pad{position:relative;z-index:16}
.controls button,.pad button{background:var(--bg)}
.controls button:hover,.pad button:hover{background:var(--glow)}
#fall{position:fixed;left:0;top:0;width:auto;height:auto;max-width:none;pointer-events:none;z-index:15}
</style>
</head>
<body>
<h1>Aqua Slider</h1>
<div class="description">水流で常に下へ流されます。←→で移動、一定間隔で噴き上がるジェットに乗って爽快！</div>
<div class="controls"><button onclick="initGame()">迷路を再生成</button><button onclick="restart()">やり直し (R)</button></div>
<div id="game-container">
  <canvas id="c"></canvas>
  <div id="clear-message"><h2>STAGE CLEAR!</h2><button onclick="initGame()">次へ挑戦</button></div>
</div>
<div class="pad"><button id="bl">◀</button><button id="br">▶</button></div>
<canvas id="fall"></canvas>
<button id="fab" class="fab" title="設定パネルを表示">⚙</button>
<div class="sliders">
  <h3 id="drag">Settings<button id="hide" title="非表示">✕</button></h3>
  <label>落下速度<input type="range" id="sFlow" min="0.5" max="5" step="0.1" value="1.6"><output></output></label>
  <label>ジェット間隔(秒)<input type="range" id="sInt" min="0.5" max="18" step="0.1" value="5"><output></output></label>
  <label>水流の長さ(マス)<input type="range" id="sLen" min="2" max="20" step="1" value="5"><output></output></label>
  <label>ジェットの色(色相)<input type="range" id="sHue" min="0" max="360" step="1" value="195"><output></output></label>
  <label>ジェットの明るさ<input type="range" id="sBri" min="0.2" max="2" step="0.1" value="1"><output></output></label>
  <label>ジェット上昇速度<input type="range" id="sJet" min="1" max="10" step="0.1" value="4.2"><output></output></label>
</div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false}),msg=document.getElementById('clear-message');
let FLOW=1.6,JET=-4.2,INT=5.0,segs=[];
let PL=2,JH=195,JB=1;
const BASE=3.5,FLOW0=1.6,JETMAX=10;
const COLS=21,ROWS=21,S=28,HW=0.3,HH=0.3;
let maze,jet,p,cleared,last,raf,t=0;
const keys={left:false,right:false,up:false,down:false,jump:false};
let grounded=false;
let breakTimer=0;
let particles=[];
let gameOver=false;
let breakCount=0;

const rnd=n=>Math.floor(Math.random()*n);
const goal={x:COLS-2,y:ROWS-2};

function carve(){
  maze=Array.from({length:ROWS},()=>Array(COLS).fill(1));
  const st=[{x:1,y:1}];maze[1][1]=0;
  const D=[[0,-2],[2,0],[0,2],[-2,0]];
  while(st.length){
    const c=st[st.length-1],o=D.filter(([dx,dy])=>{const nx=c.x+dx,ny=c.y+dy;return nx>0&&nx<COLS-1&&ny>0&&ny<ROWS-1&&maze[ny][nx]===1});
    if(o.length){const [dx,dy]=o[rnd(o.length)];maze[c.y+dy/2][c.x+dx/2]=0;maze[c.y+dy][c.x+dx]=0;st.push({x:c.x+dx,y:c.y+dy});}
    else st.pop();
  }
}
function solve(){
  const prev=new Map(),key=(x,y)=>y*COLS+x,q=[[1,1]];prev.set(key(1,1),null);
  for(let i=0;i<q.length;i++){
    const [x,y]=q[i];
    for(const [dx,dy] of [[0,-1],[1,0],[0,1],[-1,0]]){
      const nx=x+dx,ny=y+dy;
      if(maze[ny]&&maze[ny][nx]===0&&!prev.has(key(nx,ny))){prev.set(key(nx,ny),[x,y]);q.push([nx,ny]);}
    }
  }
  const path=[];let c=[goal.x,goal.y];
  while(c){path.push(c);c=prev.get(key(c[0],c[1]));}
  return path.reverse();
}
function generate(){
  let path,ups=0;
  for(let n=0;n<300&&ups<6;n++){
    carve();path=solve();ups=0;
    for(let i=1;i<path.length;i++)if(path[i][1]<path[i-1][1])ups++;
  }
  jet=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  for(let i=1;i<path.length;i++){
    const a=path[i-1],b=path[i];
    if(b[1]<a[1]){jet[a[1]][a[0]]=true;jet[b[1]][b[0]]=true;}
  }
  segs=[];
  for(let c=0;c<COLS;c++){let r=0;while(r<ROWS){if(jet[r][c]){const t0=r;while(r<ROWS&&jet[r][c])r++;const sg={x:c,top:t0,bot:r-1,pulses:[],tm:1e9};buildPath(sg);segs.push(sg);}else r++;}}
}
const DIRS=[[0,-1],[1,0],[-1,0],[0,1]],EXT_MAX=20,RR=.4;
function buildPath(s){
  const cells=[];for(let r=s.bot;r>=s.top;r--)cells.push([s.x,r]);
  s.n=cells.length;
  let prev=cells[s.n-2],cur=cells[s.n-1];
  for(let k=0;k<EXT_MAX;k++){
    let nx=null;
    for(const [dx,dy] of DIRS){
      const c=cur[0]+dx,r=cur[1]+dy;
      if(r>=0&&r<ROWS&&c>=0&&c<COLS&&maze[r][c]===0&&!(c===prev[0]&&r===prev[1])){nx=[c,r];break;}
    }
    if(!nx)break;
    cells.push(nx);prev=cur;cur=nx;
    if(cur[0]===goal.x&&cur[1]===goal.y)break;
  }
  s.cells=cells;s.total=cells.length;
  const pcs=[];let ax=s.x+.5,ay=s.bot+1,UA=0,dx=0,dy=-1;
  for(let i=1;i<cells.length;i++){
    const ddx=cells[i][0]-cells[i-1][0],ddy=cells[i][1]-cells[i-1][1];
    if(ddx!==dx||ddy!==dy){
      const u=i-.5;pcs.push({ax,ay,UA,UB:u,dx,dy});
      ax=cells[i-1][0]+.5;ay=cells[i-1][1]+.5;UA=u;dx=ddx;dy=ddy;
    }
  }
  pcs.push({ax,ay,UA,UB:cells.length,dx,dy});
  s.pieces=pcs;
  s.arcs=[];
  for(let j=0;j<pcs.length-1;j++){
    const a=pcs[j],b=pcs[j+1],cr=a.dx*b.dy-a.dy*b.dx;
    s.arcs.push({ox:b.ax+(-a.dx+b.dx)*RR,oy:b.ay+(-a.dy+b.dy)*RR,th0:Math.atan2(-b.dy,-b.dx),sg:cr>0?1:-1,k:cr>0?-1:1});
  }
}
const lmax=s=>Math.min(s.total,s.n+PL);
function updJets(dt){
  for(const s of segs){
    s.tm+=dt;if(s.tm>=INT){s.tm=0;s.pulses.push({d:0});}
    for(const w of s.pulses)w.d+=-JET*dt;
    const L=lmax(s);
    while(s.pulses.length&&s.pulses[0].d-PL>=L)s.pulses.shift();
  }
}
function riding(){
  const cx=Math.floor(p.x),cy=Math.floor(p.y),rx=p.x-(cx+.5),ry=p.y-(cy+.5);
  for(const s of segs){
    if(!s.pulses.length)continue;
    const L=lmax(s),cs=s.cells;
    for(let i=0;i<cs.length;i++){
      if(cs[i][0]!==cx||cs[i][1]!==cy)continue;
      const pv=cs[i-1],nx=cs[i+1];
      const ix=pv?cx-pv[0]:0,iy=pv?cy-pv[1]:-1;
      const ox=nx?nx[0]-cx:ix,oy=nx?nx[1]-cy:iy;
      const a=rx*ix+ry*iy;
      const before=a<0;
      const up=before?i+.5+a:i+.5+rx*ox+ry*oy;
      for(const w of s.pulses){
        const ut=Math.max(0,w.d-PL),uh=Math.min(w.d,L);
        if(up-HH<=uh+.05&&up+HH>=ut)
          return{dx:before?ix:ox,dy:before?iy:oy,last:i+1>=Math.ceil(L-1e-6)};
      }
    }
  }
  return null;
}

const solid=(c,r)=>c<0||r<0||c>=COLS||(r<ROWS&&maze[r][c]===1);
function blocked(x,y){
  for(const dx of[-HW,HW])for(const dy of[-HH,HH])if(solid(Math.floor(x+dx),Math.floor(y+dy)))return true;
  return false;
}

function spawnBreakParticles(bx, by) {
  const wx = (bx + 0.5) * S;
  const wy = (by + 0.5) * S;
  for (let i = 0; i < 8; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.5 + Math.random() * 1.5;
    particles.push({x: wx,y: wy,vx: Math.cos(angle) * speed,vy: Math.sin(angle) * speed,alpha: 1.0,decay: 0.05 + Math.random() * 0.04,size: 1 + Math.random() * 1.5,color: '#64d2ff'});
  }
}

function spawnExplosionParticles() {
  const px = p.x * S;
  const py = p.y * S;
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = (0.5 + Math.random() * 1.5) * 1.125;
    particles.push({
      x: px,
      y: py,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      alpha: 1.0,
      decay: 0.03 + Math.random() * 0.03,
      size: (1 + Math.random() * 1.5) * 1.6875,
      color: Math.random() < 0.5 ? "#ffaa00" : "#ff3300"
    });
  }
}

function updParticles(){
  let n=0;
  for(let i=0;i<particles.length;i++){
    const pt=particles[i];
    pt.x+=pt.vx;pt.y+=pt.vy;pt.alpha-=pt.decay;
    if(pt.alpha>0)particles[n++]=pt;
  }
  particles.length=n;
}

function fallOutY(){
  const r=canvas.getBoundingClientRect();
  return (innerHeight-r.top)/(r.width/canvas.width*S)+1;
}

function step(dt){
  if(gameOver && breakCount >= 2){
    updParticles();
    return;
  }

  const dir=p.y>=ROWS?0:(keys.right?1:0)-(keys.left?1:0);
  const cx=Math.floor(p.x),cy=Math.floor(p.y),R=riding(),j=!!R,hz=j&&R.dx!==0,sp=-JET;
  const inConn=cy%2===0&&cx%2===1&&!solid(cx,cy);
  if(inConn||(j&&!hz&&(dir===0||sp>=JETMAX))){
    p.x+=(cx+.5-p.x)*Math.min(1,12*dt);p.vx=0;
  }else{
    if(!hz&&dir===0&&cx%2===1){
      const r2=Math.floor(p.y+HH+.05);
      if(!solid(cx,r2)&&r2%2===0)p.x+=(cx+.5-p.x)*Math.min(1,8*dt);
    }
    const k=Math.max(0,1+JET/JETMAX);
    const tv=hz?R.dx*sp+dir*BASE*k:dir*BASE*(j?k:FLOW0/FLOW);
    p.vx+=(tv-p.vx)*Math.min(1,12*dt);
    const nx=p.x+p.vx*dt;
    if(!blocked(nx,p.y))p.x=nx;
    else if(!blocked(nx,p.y-.2)){p.x=nx;p.y-=.2;}
    else p.vx=0;
  }
  
  let target=FLOW;
  if(j){
    if(hz)target=Math.max(-sp,Math.min(sp,(cy+.5-p.y)*8));
    else target=(R.dy<0&&R.last&&p.y<cy+.4)?FLOW:R.dy*sp;
  }

  if(keys.jump&&(grounded||j)){
    p.vy=-3.0;
    grounded=false;
  }else if(p.y>=ROWS){
    p.vy+=FALL_G*dt;
  }else{
    p.vy+=(target-p.vy)*Math.min(1,(j?12:6)*dt);
  }

  const ny=p.y+p.vy*dt;
  if(!blocked(p.x,ny)){
    p.y=ny;
    grounded=false;
  }else{
    if(p.vy>0)grounded=true;
    p.vy=0;
  }

  if(p.x < 0 || p.x >= COLS || p.y < 0 || (p.y >= ROWS + 1 && p.y >= fallOutY())){
    gameOver = true;
    return;
  }

  // 下以外の壁破壊をなくすため、keys.down のみが破壊対象になるよう変更
  if(keys.down){
    const targetX = Math.floor(p.x);
    const targetY = Math.floor(p.y + HH * 1.5);
    
    const isOut = targetX < 0 || targetX >= COLS || targetY < 0;
    const isValidTarget = isOut || solid(targetX, targetY);

    if(isValidTarget){
      breakTimer += dt;
      if(breakTimer >= 0.4){
        breakCount++;
        if(breakCount === 1){
          if(!isOut){
            maze[targetY][targetX] = 0;
            spawnBreakParticles(targetX, targetY);
            buildBg();
          } else {
            spawnBreakParticles(Math.floor(p.x), Math.floor(p.y));
          }
        } else if(breakCount >= 2){
          spawnExplosionParticles();
          gameOver = true;
          keys.left=false;
          keys.right=false;
          keys.up=false;
          keys.down=false;
          keys.jump=false;
          breakTimer = 0;
          return;
        }
        breakTimer = 0;
      }
    } else {
      breakTimer = 0;
    }
  } else {
    breakTimer = 0;
  }

  updParticles();

  const gx=p.x-(goal.x+.5),gy=p.y-(goal.y+.5);
  if(gx*gx+gy*gy<.25){cleared=true;setTimeout(()=>msg.style.display='flex',300);}
}

function star(cx,cy,R,rot){
  ctx.beginPath();
  for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,r=i%2?R*.45:R;ctx[i?'lineTo':'moveTo'](cx+Math.cos(a)*r,cy+Math.sin(a)*r);}
  ctx.closePath();
}
let bg,floorCells=[],running=false;
function buildBg(){
  if(!bg){bg=document.createElement('canvas');bg.width=COLS*S;bg.height=ROWS*S;}
  const g=bg.getContext('2d');g.clearRect(0,0,bg.width,bg.height);floorCells=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const x=c*S,y=r*S;
    if(maze[r][c]){
      g.fillStyle='#1a2636';g.fillRect(x+1,y+1,S-2,S-2);
      g.strokeStyle='#2c425c';g.lineWidth=1;g.strokeRect(x+1,y+1,S-2,S-2);
    }else{
      g.fillStyle='#06152d';g.fillRect(x,y,S,S);
      floorCells.push(x,y,c*7+r*3);
    }
  }
}
function ptAt(s,u,lat){
  const P=s.pieces,np=P.length,hr=Math.PI/2;
  for(let j=0;j<np;j++){
    const q=P[j];
    if(j===np-1||u<=q.UB-RR)return[(q.ax+q.dx*(u-q.UA))*S-q.dy*lat,(q.ay+q.dy*(u-q.UA))*S+q.dx*lat];
    if(u<=q.UB+RR){
      const c=s.arcs[j],th=c.th0+c.sg*hr*(u-(q.UB-RR))/(2*RR),r=RR*S+c.k*lat;
      return[c.ox*S+r*Math.cos(th),c.oy*S+r*Math.sin(th)];
    }
  }
}
function drawPulses(){
  const hi=Math.min(98,90*JB),lo=Math.min(95,50*JB),a0=Math.min(1,.95*JB),a1=Math.min(1,.15*JB);
  const col=f=>`hsla(${JH},100%,${hi+(lo-hi)*f}%,${a0+(a1-a0)*f})`;
  ctx.fillStyle=`hsla(${JH},100%,${lo}%,${Math.min(1,.4*JB)})`;ctx.beginPath();
  for(const s of segs)ctx.rect(s.x*S+4,(s.bot+1)*S-3,S-8,3);
  ctx.fill();
  const ln=new Path2D(),hw=S/2-3,hr=Math.PI/2;
  for(const s of segs){
    const L=lmax(s),pcs=s.pieces,np=pcs.length;
    for(const w of s.pulses){
      const ut=Math.max(0,w.d-PL),uh=Math.min(w.d,L),len=uh-ut;if(len*S<1)continue;
      for(let j=0;j<np;j++){
        const q=pcs[j];
        const ua=Math.max(q.UA+(j>0?RR:0),ut),ub=Math.min(q.UB-(j<np-1?RR:0),uh);
        if((ub-ua)*S<.5)continue;
        const ax=(q.ax+q.dx*(ua-q.UA))*S,ay=(q.ay+q.dy*(ua-q.UA))*S,bx=(q.ax+q.dx*(ub-q.UA))*S,by=(q.ay+q.dy*(ub-q.UA))*S;
        const g=ctx.createLinearGradient(ax,ay,bx,by);
        g.addColorStop(0,col((uh-ua)/len));g.addColorStop(1,col((uh-ub)/len));
        const rs=ua<=ut+1e-6?6:0,re=ub>=uh-1e-6?6:0;
        let rad,x,y,wd,ht;
        if(q.dx===0){x=ax-hw;wd=2*hw;y=Math.min(ay,by);ht=Math.abs(by-ay);rad=q.dy<0?[re,re,rs,rs]:[rs,rs,re,re];}
        else{y=ay-hw;ht=2*hw;x=Math.min(ax,bx);wd=Math.abs(bx-ax);rad=q.dx>0?[rs,re,re,rs]:[re,rs,rs,re];}
        ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,wd,ht,rad);ctx.fill();
      }
      ctx.lineWidth=2*hw;
      for(let j=0;j<np-1;j++){
        const UC=pcs[j].UB,ua=Math.max(UC-RR,ut),ub=Math.min(UC+RR,uh);
        if((ub-ua)*S<.5)continue;
        const c=s.arcs[j],fa=(ua-(UC-RR))/(2*RR),fb=(ub-(UC-RR))/(2*RR);
        const pa=ptAt(s,ua,0),pb=ptAt(s,ub,0);
        const g=ctx.createLinearGradient(pa[0],pa[1],pb[0],pb[1]);
        g.addColorStop(0,col((uh-ua)/len));g.addColorStop(1,col((uh-ub)/len));
        ctx.strokeStyle=g;ctx.beginPath();
        ctx.arc(c.ox*S,c.oy*S,RR*S,c.th0+c.sg*hr*fa,c.th0+c.sg*hr*fb,c.sg<0);
        ctx.stroke();
      }
      for(let k=0;k<3;k++){
        const o=(t*90+k*17)%(len*S),u1=ut+o/S,u2=ut+Math.max(0,o-8)/S,lat=(k-1)*6;
        const p1=ptAt(s,u1,lat),pm=ptAt(s,(u1+u2)/2,lat),p2=ptAt(s,u2,lat);
        ln.moveTo(p1[0],p1[1]);ln.lineTo(pm[0],pm[1]);ln.lineTo(p2[0],p2[1]);
      }
    }
  }
  ctx.strokeStyle=`rgba(255,255,255,${Math.min(1,.6*JB)})`;ctx.lineWidth=2;ctx.stroke(ln);
}
const FALL_Y=ROWS-1,FALL_G=1;
const fallCv=document.getElementById('fall'),fctx=fallCv.getContext('2d');
let fallDirty=false;
function drawShip(g,px,py,k){
  const hw=HW*S*k,hh=HH*S*k;
  g.shadowBlur=15*k;g.shadowColor='#ffaa00';g.fillStyle='#ffea00';
  g.beginPath();
  if(breakCount===0)g.roundRect(px-hw,py-hh,2*hw,2*hh,5*k);
  else{
    const r=4*k;
    g.moveTo(px,py-hh+r);
    g.arcTo(px+hw,py+hh,px-hw,py+hh,r);
    g.arcTo(px-hw,py+hh,px,py-hh,r);
    g.arcTo(px,py-hh,px+hw,py+hh,r);
    g.closePath();
  }
  g.fill();
}
function draw(){
  ctx.drawImage(bg,0,0);
  ctx.fillStyle=`hsla(${JH},100%,50%,${Math.min(1,.07*JB)})`;ctx.beginPath();
  for(const s of segs){const m=Math.min(s.cells.length,Math.ceil(lmax(s)-1e-6));for(let i=0;i<m;i++)ctx.rect(s.cells[i][0]*S,s.cells[i][1]*S,S,S);}
  ctx.fill();
  ctx.strokeStyle='rgba(0,136,255,.2)';ctx.lineWidth=2;ctx.beginPath();
  for(let i=0;i<floorCells.length;i+=3){
    const x=floorCells[i],y=floorCells[i+1],ph=floorCells[i+2];
    for(let k=0;k<2;k++){
      const off=(t*30+ph+k*14)%S,lx=x+8+k*12;
      ctx.moveTo(lx,y+off);ctx.lineTo(lx,y+Math.min(S,off+8));
    }
  }
  ctx.stroke();
  drawPulses();

  let pc=null;
  for(const pt of particles){
    if(pt.color!==pc){
      if(pc!==null)ctx.fill();
      ctx.fillStyle=pc=pt.color;ctx.beginPath();
    }
    ctx.moveTo(pt.x+pt.size,pt.y);
    ctx.arc(pt.x,pt.y,pt.size,0,Math.PI*2);
  }
  if(pc!==null)ctx.fill();

  ctx.shadowBlur=14+5*Math.sin(t*4);ctx.shadowColor='#00e676';ctx.fillStyle='#00e676';
  star((goal.x+.5)*S,(goal.y+.5)*S,S*.42,t*1.2);ctx.fill();
  
  let falling=false;
  if(!gameOver || breakCount < 2){
    if(p.y<FALL_Y)drawShip(ctx,p.x*S,p.y*S,1);
    else{
      falling=true;
      const r=canvas.getBoundingClientRect(),k=r.width/canvas.width;
      if(fallCv.width!==innerWidth||fallCv.height!==innerHeight){fallCv.width=innerWidth;fallCv.height=innerHeight;}
      else fctx.clearRect(0,0,fallCv.width,fallCv.height);
      drawShip(fctx,r.left+p.x*S*k,r.top+p.y*S*k,k);
      fctx.shadowBlur=0;fallDirty=true;
    }
  }
  if(!falling&&fallDirty){fctx.clearRect(0,0,fallCv.width,fallCv.height);fallDirty=false;}
  ctx.shadowBlur=0;
}
function loop(ts){
  const dt=Math.min(.033,(ts-last)/1000||0);last=ts;t+=dt;
  if(!cleared){
    updJets(dt);
    step(dt);
  }
  draw();
  if(cleared){running=false;return;}
  raf=requestAnimationFrame(loop);
}
function restart(){
  p={x:1.5,y:1.5,vx:0,vy:0};cleared=false;gameOver=false;breakCount=0;msg.style.display='none';grounded=false;
  breakTimer=0; particles=[];
  for(const g of segs){g.pulses=[];g.tm=1e9;}
  if(!running){running=true;last=performance.now();raf=requestAnimationFrame(loop);}
}
function initGame(){
  cancelAnimationFrame(raf);running=false;
  canvas.width=COLS*S;canvas.height=ROWS*S;
  generate();buildBg();restart();
}
const map={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up','w':'up','W':'up',ArrowDown:'down','s':'down','S':'down'};
addEventListener('keydown',e=>{
  if(gameOver) return;
  if(map[e.key]){
    keys[map[e.key]]=true;
    e.preventDefault();
  }else if(e.key===' '||e.key==='Space'||e.code==='Space'){
    keys.jump=true;
    e.preventDefault();
  }else if(e.key==='Enter'&&cleared){
    e.preventDefault();
    initGame();
  }else if(e.key==='r'||e.key==='R'){
    restart();
  }else if(e.key.startsWith('Arrow')){
    e.preventDefault();
  }
});
addEventListener('keyup',e=>{
  if(map[e.key])keys[map[e.key]]=false;
  else if(e.key===' '||e.key==='Space'||e.code==='Space')keys.jump=false;
});
[['bl','left'],['br','right']].forEach(([id,k])=>{
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{if(gameOver)return; keys[k]=true;e.preventDefault();});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false));
});

[['sFlow',v=>FLOW=v,1],['sInt',v=>INT=v,1],['sLen',v=>PL=v,0],['sHue',v=>JH=v,0],['sBri',v=>JB=v,1],['sJet',v=>JET=-v,1]].forEach(([id,fn,digits])=>{
  const el=document.getElementById(id),out=el.nextElementSibling;
  const apply=()=>{
    const val=parseFloat(el.value);
    if(id==='sInt'){
      const inverted = 18.5 - val;
      fn(inverted);
      out.textContent=inverted.toFixed(digits);
    }else{
      fn(val);
      out.textContent=val.toFixed(digits);
    }
  };
  el.addEventListener('input',apply);
  el.addEventListener('change',()=>el.blur());
  
  if(id==='sInt'){
    el.value = 18.5 - 5;
  }
  apply();
});

const panel=document.querySelector('.sliders'),dh=document.getElementById('drag');
let drag=null;
const clampP=(x,y)=>[Math.max(0,Math.min(innerWidth-panel.offsetWidth,x)),Math.max(0,Math.min(innerHeight-panel.offsetHeight,y))];
dh.addEventListener('pointerdown',e=>{
  if(e.target.closest('button'))return;
  const r=panel.getBoundingClientRect();
  drag={dx:e.clientX-r.left,dy:e.clientY-r.top};
  panel.style.left=r.left+'px';panel.style.top=r.top+'px';panel.style.bottom='auto';panel.style.right='auto';panel.style.transform='none';
  dh.setPointerCapture(e.pointerId);dh.style.cursor='grabbing';e.preventDefault();
});
dh.addEventListener('pointermove',e=>{
  if(!drag)return;
  const [x,y]=clampP(e.clientX-drag.dx,e.clientY-drag.dy);
  panel.style.left=x+'px';panel.style.top=y+'px';
});
['pointerup','pointercancel'].forEach(ev=>dh.addEventListener(ev,()=>{drag=null;dh.style.cursor='';}));
const tgl=e=>{
  panel.classList.toggle('hidden');e.currentTarget.blur();
  const hid=panel.classList.contains('hidden');
  document.getElementById('fab').style.display=hid?'block':'none';
  if(!hid&&panel.style.top){const r=panel.getBoundingClientRect(),[x,y]=clampP(r.left,r.top);panel.style.left=x+'px';panel.style.top=y+'px';}
};
document.getElementById('fab').addEventListener('click',tgl);
document.getElementById('hide').addEventListener('click',tgl);

addEventListener('resize',()=>{
  if(!panel.style.top||panel.classList.contains('hidden'))return;
  const r=panel.getBoundingClientRect(),[x,y]=clampP(r.left,r.top);
  panel.style.left=x+'px';panel.style.top=y+'px';
});
initGame();
</script>
